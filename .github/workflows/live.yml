name: WC2026 Live Goals

on:
  schedule:
    # ทุก 10 นาที ช่วง UTC 16:00-06:55 = ไทย 23:00-13:55 — แต่ละรอบวนเช็คเองทุก 60 วิ นาน ~28 นาที
    # (concurrency ต่อคิวให้เอง: ตัวที่รันอยู่ทำงานต่อ ตัวใหม่รอรับช่วง = ไร้รอยต่อแม้บางรอบโดนข้าม)
    - cron: "*/10 0-6,16-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# กันรอบใหม่รันทับรอบเก่า (ต่อคิวแทน) เพื่อไม่ให้ส่งข้อความซ้ำ
concurrency:
  group: live-loop
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Report live goals (long-poll)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          LOOP_MINUTES: "28"
        run: python live.py
